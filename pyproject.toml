[project]
name = "sigma-signals"
version = "0.3.19"
description = "Cited podcast and X signals checked against their sources"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
keywords = ["signals", "podcasts", "transcription", "whisper", "investing", "llm-agents"]
dependencies = ["feedparser>=6", "youtube-transcript-api>=1.0", "yt-dlp", "pyyaml", "requests", "jsonschema"]

[project.urls]
Homepage = "https://github.com/d3ming/sigma"
Documentation = "https://github.com/d3ming/sigma/blob/develop/docs/architecture.md"

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2", "av<16"]
mac = ["mlx-whisper"]
dev = ["pytest", "pytest-xdist"]
verify = ["playwright>=1.49"]

[project.scripts]
sigma = "sigma.cli:main"

[tool.setuptools]
packages = ["sigma"]

[tool.pytest.ini_options]
addopts = "-n 4"
filterwarnings = ["ignore::DeprecationWarning:feedparser"]
markers = ["slow: the heaviest modules; `make test-fast` skips them"]
